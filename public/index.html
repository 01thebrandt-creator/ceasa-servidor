<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141C18" media="(prefers-color-scheme: dark)">
<meta name="description" content="Controle de despachos e acertos de hortifrúti no Ceasa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ceasa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Controle Ceasa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230D5A34'/%3E%3Cpath d='M32 10c9 2 14 8 13 17-9 0-15-3-17-11 0-3 1-5 4-6z' fill='%23FFC72C'/%3E%3Cpath d='M12 30h40v21a3 3 0 0 1-3 3H15a3 3 0 0 1-3-3z' fill='%23fff'/%3E%3Cpath d='M12 38h40M12 46h40' stroke='%230D5A34' stroke-width='3'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Controle Ceasa · visual
   Ideia: a "lousa" de preços do Ceasa. Uma peça forte (o quadro verde-escuro com os totais e o preço da assinatura);
   o resto fica quieto: papel claro, linhas finas, números tabulares grandes. Letra do sistema (Roboto/SF): lê bem no sol e não baixa nada. */
:root{
  --bg:#ECF1ED;--surface:#FFFFFF;--surface-2:#F4F7F5;--line:#DCE4DF;--line-2:#C3D0C8;
  --text:#13201A;--text-2:#435249;--text-3:#5F6F66;
  --brand:#0D5A34;--on-brand:#FFFFFF;--brand-soft:#E2F0E7;
  --board:#0F2A1D;--board-2:#16382A;--chalk:#F3F7F2;--chalk-2:#A8BEB0;--glow-rec:#5BE39A;--glow-pag:#FFB766;
  --rec:#0E7A42;--on-rec:#FFFFFF;--rec-soft:#DEF2E5;--rec-ink:#0A5C31;
  --pag:#B04E0C;--on-pag:#FFFFFF;--pag-soft:#FCEADA;--pag-ink:#8A3A06;
  --ok:#0E7A42;--ok-soft:#DEF2E5;--bad:#BE3328;--bad-soft:#FCE4E1;--warn:#A9550A;--warn-soft:#FCEBD6;--info:#1D5FA6;--info-soft:#E3EEFA;
  --ring:rgba(13,90,52,.32);--scrim:rgba(6,16,11,.58);
  --sh1:0 1px 1px rgba(16,32,24,.05);--sh2:0 12px 32px rgba(10,28,18,.20);
  --r:16px;--r2:12px;--av-bg:91%;--av-fg:24%;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--board:#173324;--board-2:#1F4431;--chalk:#EEF5F0;--chalk-2:#A9C2B3;--info:#8CC0FF;--info-soft:#13263A;--bg:#0B110E;--surface:#141C18;--surface-2:#1A2420;--line:#25312B;--line-2:#3A4A42;--text:#EDF4F0;--text-2:#B3C3BA;--text-3:#8DA096;--brand:#33C173;--on-brand:#06150C;--brand-soft:#11301F;--rec:#34C777;--on-rec:#06150C;--rec-soft:#11301F;--rec-ink:#7CE6A9;--pag:#FF9D52;--on-pag:#2A1200;--pag-soft:#3A2412;--pag-ink:#FFC08C;--ok:#4BDB8B;--ok-soft:#11301F;--bad:#FF8A7E;--bad-soft:#3B1815;--warn:#FFA85C;--warn-soft:#3A2412;--ring:rgba(51,193,115,.35);--scrim:rgba(0,0,0,.7);--sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 8px 24px rgba(0,0,0,.5);--av-bg:26%;--av-fg:84%;}}
:root[data-theme="dark"]{--board:#173324;--board-2:#1F4431;--chalk:#EEF5F0;--chalk-2:#A9C2B3;--info:#8CC0FF;--info-soft:#13263A;--bg:#0B110E;--surface:#141C18;--surface-2:#1A2420;--line:#25312B;--line-2:#3A4A42;--text:#EDF4F0;--text-2:#B3C3BA;--text-3:#8DA096;--brand:#33C173;--on-brand:#06150C;--brand-soft:#11301F;--rec:#34C777;--on-rec:#06150C;--rec-soft:#11301F;--rec-ink:#7CE6A9;--pag:#FF9D52;--on-pag:#2A1200;--pag-soft:#3A2412;--pag-ink:#FFC08C;--ok:#4BDB8B;--ok-soft:#11301F;--bad:#FF8A7E;--bad-soft:#3B1815;--warn:#FFA85C;--warn-soft:#3A2412;--ring:rgba(51,193,115,.35);--scrim:rgba(0,0,0,.7);--sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 8px 24px rgba(0,0,0,.5);--av-bg:26%;--av-fg:84%;color-scheme:dark}:root[data-theme="light"]{color-scheme:light}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(64px + var(--sat))}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0;text-align:inherit}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:18px;height:18px}.ic.lg{width:28px;height:28px}

/* ---------- barra superior ---------- */
.appbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding-top:var(--sat)}
@supports not (background:color-mix(in srgb,red,blue)){.appbar{background:var(--surface)}}
.appbar-in{max-width:760px;margin:0 auto;height:60px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex:none}
.ttl{font-size:21px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;align-items:center;gap:8px;flex:none}
.sync{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:650;color:var(--text-2)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--text-3)}
.sync.ok .dot{background:#1FB45F;box-shadow:0 0 0 3px rgba(31,180,95,.22)}.sync.warn .dot{background:#E6A100}.sync.bad .dot{background:var(--bad)}
.sync.ok{color:var(--rec-ink)}
.me{width:38px;height:38px;border-radius:50%;background:var(--board);color:var(--chalk);display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--line-2)}
/* o título nunca encolhe: quem cede espaço é o texto do indicador de sincronização (com reticências) */
.brand{flex:0 0 auto}
.acts{flex:0 1 auto;min-width:0}
.sync{flex:0 1 auto;min-width:0}
.sync span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me{flex:none;position:relative}
.me .gear{position:absolute;right:-5px;bottom:-5px;width:19px;height:19px;padding:2.5px;border-radius:50%;background:var(--surface);color:var(--text-2);stroke-width:2.2;box-shadow:0 0 0 1.5px var(--line-2)}
@media (max-width:399px){.appbar-in{padding:0 10px;gap:6px}.brand{gap:7px}.logo{width:28px;height:28px}.ttl{font-size:18px}.acts{gap:6px}.sync{padding:0 8px;gap:5px;font-size:12px}.sync .dot{width:8px;height:8px}}
@media (max-width:339px){.me{width:36px;height:36px}}
#banner{max-width:760px;margin:12px auto 0;padding:0 14px;display:grid;gap:8px}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r2);padding:12px 14px;background:var(--warn-soft);color:var(--text);font-size:14.5px;font-weight:550;line-height:1.4;box-shadow:inset 0 0 0 1px rgba(169,85,10,.25)}
.note.bad{background:var(--bad-soft);box-shadow:inset 0 0 0 1px rgba(190,51,40,.3)}
.note.info{background:var(--info-soft);box-shadow:inset 0 0 0 1px rgba(29,95,166,.22)}
.note .ic{color:var(--warn);margin-top:1px}.note.bad .ic{color:var(--bad)}.note.info .ic{color:var(--info)}
.note b{font-weight:750}
.note .btn{margin-top:8px}
.page{max-width:760px;margin:0 auto;padding:6px 14px calc(104px + var(--sab))}

/* ---------- botões ---------- */
a.btn{text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:var(--r2);background:var(--surface);color:var(--text);font-weight:700;font-size:16px;line-height:1.15;text-align:center;box-shadow:inset 0 0 0 1.5px var(--line-2);transition:transform .08s,background .12s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--brand);color:var(--on-brand);box-shadow:0 1px 0 rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.12)}
.btn.rec{background:var(--rec);color:var(--on-rec);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.btn.pag{background:var(--pag);color:var(--on-pag);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.btn.danger{color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--brand)}
.btn.block{width:100%}.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:var(--surface-2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow-x:visible;margin:0;padding:0}
.chip{flex:none;height:40px;padding:0 15px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-2);font-weight:650;font-size:14.5px;color:var(--text-2)}
.chip[aria-pressed="true"]{background:var(--board);color:var(--chalk);box-shadow:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button{min-height:46px;border-radius:10px;font-weight:650;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;line-height:1.1}
.seg button small{display:block;font-size:12px;font-weight:550;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,32,24,.1),inset 0 0 0 1.5px var(--line-2)}
.seg.tipo button[aria-pressed="true"].r{background:var(--rec);color:var(--on-rec);box-shadow:none}
.seg.tipo button[aria-pressed="true"].p{background:var(--pag);color:var(--on-pag);box-shadow:none}
.seg button:disabled{opacity:.5}

/* ---------- valores em R$ ---------- */
.mny{white-space:nowrap}.mny .cur{font-size:.58em;font-weight:650;opacity:.75;vertical-align:.2em;margin-right:.08em}.mny .dec{font-size:.62em;font-weight:700;opacity:.85}

/* ---------- Lançamentos: a lousa com os totais ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;margin:12px 0 14px;border-radius:20px;background:var(--board);background-image:radial-gradient(120% 140% at 0% 0%,var(--board-2) 0%,transparent 60%);color:var(--chalk);overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.08),inset 0 0 0 1px rgba(255,255,255,.04)}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;padding:15px 16px 18px;min-height:110px;text-align:left;color:var(--chalk);opacity:.62;transition:opacity .15s}
.tile+.tile{box-shadow:inset 1px 0 0 rgba(255,255,255,.10)}
.tile .lbl{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--chalk-2)}
.tile .v{font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin-top:2px}
.tile .meta{font-size:13px;font-weight:550;color:var(--chalk-2)}
.tile::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:4px;border-radius:4px 4px 0 0;background:transparent}
.tile[aria-pressed="true"]{opacity:1}
.tile.rec[aria-pressed="true"]::after{background:var(--glow-rec)}.tile.pag[aria-pressed="true"]::after{background:var(--glow-pag)}
.tile.rec[aria-pressed="true"] .lbl{color:var(--glow-rec)}.tile.pag[aria-pressed="true"] .lbl{color:var(--glow-pag)}
@media (max-width:359px){.tile{padding:13px 12px 16px}.tile .v{font-size:23px}.tile::after{left:12px;right:12px}}
.search{position:relative;margin:2px 0 10px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.search input{width:100%;height:48px;border-radius:14px;border:0;padding:0 14px 0 44px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:16px}
.search input::placeholder{color:var(--text-3)}
.search input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--brand),0 0 0 4px var(--ring)}
.dayh{display:flex;align-items:baseline;gap:8px;margin:22px 2px 8px}
.dayh .d{font-size:15px;font-weight:750;color:var(--text)}
.dayh .rel{font-size:13.5px;color:var(--text-3);font-weight:550}
.dayh .sum{margin-left:auto;font-size:14.5px;font-weight:700;color:var(--text-2)}
.entry{position:relative;background:var(--surface);border-radius:var(--r);margin:0 0 10px;box-shadow:var(--sh1),inset 0 0 0 1px var(--line);overflow:hidden}
.entry::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rec)}
.entry.pag::before{background:var(--pag)}
.entry.flash{box-shadow:0 0 0 3px #F5B700,var(--sh2)}
.entry.canc .name,.entry.canc .amt,.entry.canc .sub{text-decoration:line-through;opacity:.55}
.e-main{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start;width:100%;padding:14px 14px 10px 18px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:750;font-size:15px;background:hsl(var(--h) 36% var(--av-bg));color:hsl(var(--h) 52% var(--av-fg));flex:none}
.av.lg{width:52px;height:52px;font-size:18px}
.e-body{min-width:0;display:flex;flex-direction:column;gap:2px}
.name{font-size:17px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.sub{font-size:14.5px;color:var(--text-2);font-weight:500}
.amt{font-size:19px;font-weight:800;letter-spacing:-.02em;text-align:right;white-space:nowrap}
.entry.rec .amt{color:var(--rec-ink)}.entry.pag .amt{color:var(--pag-ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;font-weight:650;color:var(--text-2)}
.tag .ic{width:14px;height:14px}
.tag.wait{background:var(--warn-soft);color:var(--warn);box-shadow:none}
.tag.bad{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.e-act{padding:0 14px 14px 18px;display:grid;gap:8px}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 10px;border-radius:12px;font-size:14.5px;font-weight:700;text-align:center;line-height:1.1}
.pill .ic{width:20px;height:20px;stroke:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.no{background:var(--bad-soft);color:var(--bad)}
button.pill{box-shadow:inset 0 0 0 1.5px currentColor}
button.pill:active{transform:scale(.97)}
.pnote{font-size:13px;color:var(--text-3);font-weight:550;padding:0 14px 12px 18px;margin-top:-2px}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:42px 22px;color:var(--text-2)}
.empty .ill{width:84px;height:84px;color:var(--line-2)}
.empty h3{font-size:18px;color:var(--text)}.empty p{font-size:15px;max-width:30ch}
.more{margin:6px 0 12px}

/* ---------- barra inferior ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabbar-in{max-width:760px;margin:0 auto;height:66px;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center}
.tab{height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:650;color:var(--text-3);text-align:center;padding:0 2px}
.tab .ic{width:24px;height:24px;box-sizing:content-box;padding:3px 14px;border-radius:999px;transition:background .15s}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"] .ic{stroke-width:2.4;background:var(--brand-soft)}
.tab-new{justify-self:center;width:58px;height:58px;margin-top:-22px;border-radius:18px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 8px 20px rgba(13,90,52,.36),0 0 0 5px var(--surface);transition:transform .08s}
.tab-new:active{transform:scale(.95)}
.tab-new .ic{width:28px;height:28px;stroke-width:2.6}
@media (max-width:359px){.tab .ic{padding:3px 8px}}

/* ---------- janelas ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.scrim.front{z-index:70}
.sheet{width:100%;max-width:560px;max-height:calc(100vh - var(--sat) - 12px);background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh2);animation:up .2s cubic-bezier(.2,.8,.2,1)}
@supports(height:100dvh){.sheet{max-height:calc(100dvh - var(--sat) - 12px)}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 0;flex:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 20px;flex:none}
.sh-h h2{font-size:21px;font-weight:800;letter-spacing:-.015em}
.sh-b{padding:4px 20px 18px;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1 1 auto}
.sh-f{padding:12px 20px calc(14px + var(--sab));border-top:1px solid var(--line);display:grid;gap:10px;background:var(--surface);flex:none}
.sh-f .two,.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:720px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:88vh}.grab{display:none}.sh-h{padding-top:14px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}.btn,.tab-new,.tile,.tab .ic{transition:none}.spin{animation:none}}

/* ---------- formulários ---------- */
.field{margin:0 0 16px}
.field>label,.lbl{display:block;font-size:14px;font-weight:700;color:var(--text-2);margin:0 0 6px}
.lbl small,.field label small{font-weight:550;color:var(--text-3)}
.inp{width:100%;min-height:54px;border:0;border-radius:var(--r2);padding:0 14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-2);font-size:17px;font-weight:550;appearance:none;-webkit-appearance:none}
.inp:focus{outline:0;box-shadow:inset 0 0 0 2px var(--brand),0 0 0 4px var(--ring)}
.inp.err{box-shadow:inset 0 0 0 2px var(--bad);background:var(--bad-soft)}
.inp::placeholder{color:var(--text-3);font-weight:450}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),linear-gradient(135deg,var(--text-2) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
textarea.inp{padding:12px 14px;min-height:84px;resize:vertical;line-height:1.35}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13.5px;font-weight:600;margin-top:6px;color:var(--text-3);min-height:19px}.hint.good{color:var(--ok)}
.err-msg{color:var(--bad);font-weight:700;font-size:14.5px;min-height:0;margin:0 0 10px}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sug button{height:36px;padding:0 13px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2);font-size:14px;font-weight:600;color:var(--text-2)}
.readout{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin:2px 0 16px;border-radius:var(--r);background:var(--brand-soft);color:var(--text)}
.readout .k{font-size:14px;font-weight:700;color:var(--text-2)}
.readout .f{font-size:14px;font-weight:600;color:var(--text-2)}
.readout .v{font-size:30px;font-weight:800;letter-spacing:-.025em;color:var(--brand);text-align:right;line-height:1.1}
.rec-t .readout{background:var(--rec-soft)}.rec-t .readout .v{color:var(--rec-ink)}.pag-t .readout{background:var(--pag-soft)}.pag-t .readout .v{color:var(--pag-ink)}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin:0;flex:none;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line-2);display:inline-grid;place-content:center}
input[type=checkbox]::after{content:"";width:14px;height:8px;border-left:3.5px solid var(--on-brand);border-bottom:3.5px solid var(--on-brand);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
input[type=checkbox]:checked{background:var(--brand);box-shadow:none}input[type=checkbox]:checked::after{opacity:1}
/* interruptor (liga/desliga) */
input[type=checkbox].toggle{width:52px;height:32px;border-radius:999px;background:var(--line-2);box-shadow:none;position:relative;display:inline-block;transition:background .15s}
input[type=checkbox].toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border:0;border-radius:50%;background:#fff;opacity:1;transform:none;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
input[type=checkbox].toggle:checked{background:var(--brand)}input[type=checkbox].toggle:checked::after{transform:translateX(20px)}
.sw{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:600;font-size:15px;margin:6px 0}

/* ---------- Fechamento ---------- */
.search.mt{margin-top:12px}
.rows{display:grid;gap:10px;margin-top:12px}
.row{display:grid;grid-template-columns:44px 1fr auto 20px;gap:12px;align-items:center;width:100%;min-height:68px;padding:10px 12px 10px 14px;border-radius:var(--r);background:var(--surface);box-shadow:var(--sh1),inset 0 0 0 1px var(--line)}
.row .nm{font-weight:700;font-size:16.5px;line-height:1.2;overflow-wrap:anywhere}.row .ms{font-size:13.5px;color:var(--text-3);font-weight:550}
.row .ic.chev{color:var(--line-2);width:20px;height:20px}
.row .v{font-weight:800;font-size:17px;letter-spacing:-.01em}.row.rec .v{color:var(--rec-ink)}.row.pag .v{color:var(--pag-ink)}.row .v.zero{color:var(--text-3);font-weight:650}
.back{display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 10px 0 2px;font-weight:700;color:var(--brand);margin:6px 0 0 -4px}
.wk{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;margin:6px 0 12px}
.wk .iconbtn{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.wk .mid{display:block;width:100%;min-height:48px;border-radius:12px;text-align:center;font-weight:750;font-size:17px;line-height:1.15}.wk .mid small{display:block;font-size:12.5px;color:var(--text-3);font-weight:600}
.stmt{background:var(--surface);border-radius:20px;box-shadow:var(--sh1),inset 0 0 0 1px var(--line);overflow:hidden}
.stmt-h{display:flex;align-items:center;gap:14px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.stmt-h h2{font-size:21px;font-weight:800;letter-spacing:-.015em;line-height:1.15;overflow-wrap:anywhere}.stmt-h small{display:block;font-size:13px;color:var(--text-3);font-weight:600;margin-top:2px}
.sums{padding:6px 16px 4px}
.sr{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0;font-size:15px;font-weight:600;color:var(--text-2)}
.sr b{font-size:16px;color:var(--text)}
.total{margin:6px 16px 8px;padding:15px 16px 16px;border-radius:var(--r);background:var(--board);background-image:radial-gradient(120% 160% at 0% 0%,var(--board-2) 0%,transparent 60%);color:var(--chalk);display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.total::after{content:"";position:absolute;left:16px;width:56px;bottom:0;height:4px;border-radius:4px 4px 0 0;background:var(--glow-rec)}
.pag-t .total::after{background:var(--glow-pag)}
.total .k{font-size:14px;font-weight:700;color:var(--chalk-2)}
.total .v{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:var(--chalk)}
.stmt .sw{margin:0 16px 4px}
.cnote{font-size:13.5px;color:var(--text-3);font-weight:600;margin:0 16px 8px;line-height:1.4}
.sec{margin:12px 16px 0;padding-top:12px;border-top:1px solid var(--line);font-size:14px;font-weight:750;color:var(--text);display:flex;justify-content:space-between}
.sec span:last-child{color:var(--text-3);font-weight:650}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:4px;align-items:center;padding:4px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.canc{opacity:.55;text-decoration:line-through}
.chk{width:44px;height:44px;display:grid;place-items:center}
.chk .ic{width:22px;height:22px;stroke:none}
.im{min-height:56px;padding:8px 6px 8px 0;display:flex;flex-direction:column;gap:1px;text-align:left}
.im b{font-size:15.5px;font-weight:650;line-height:1.25}.im small{font-size:13px;color:var(--text-3);font-weight:550}
.item .a{font-weight:750;font-size:15.5px;white-space:nowrap}
.paybar{position:sticky;bottom:calc(76px + var(--sab));z-index:20;margin-top:14px;padding:10px;border-radius:18px;background:var(--surface);box-shadow:var(--sh2),inset 0 0 0 1px var(--line);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.paybar .sel{display:flex;flex-direction:column;line-height:1.15;padding-left:6px;min-width:100px}
.paybar .sel small{font-size:12.5px;font-weight:650;color:var(--text-3)}.paybar .sel b{font-size:21px;font-weight:800}
.paybar .btn{width:100%;min-height:54px}

/* ---------- Histórico ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:2px 0 14px}
.stat{padding:12px 14px;border-radius:var(--r);background:var(--surface);box-shadow:var(--sh1),inset 0 0 0 1px var(--line)}
.stat h3{font-size:14.5px;font-weight:750;color:var(--text-2);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.stat.rec h3{color:var(--rec-ink)}.stat.pag h3{color:var(--pag-ink)}
.stat dl{margin:0;display:grid;gap:3px;font-size:14px}.stat dl div{display:flex;justify-content:space-between;gap:8px;font-weight:600;color:var(--text-2)}.stat dd{margin:0;font-weight:750;color:var(--text)}
.grp{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh1),inset 0 0 0 1px var(--line);margin:0 0 12px;overflow:hidden}
.grp-h{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.grp-h .t{flex:1;min-width:0}.grp-h b{display:block;font-size:16px;overflow-wrap:anywhere}.grp-h small{font-size:12.5px;font-weight:600;color:var(--text-3)}
.grp-h .s{font-weight:800;font-size:16px}
.date-in{height:44px;max-width:170px;font-size:15px;padding:0 10px}

/* ---------- Ajustes ---------- */
.card-me{display:flex;align-items:center;gap:14px;padding:16px;margin:12px 0;border-radius:var(--r);background:var(--board);color:var(--chalk);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.card-me .av{background:var(--chalk);color:var(--board)}
.card-me b{font-size:18px;display:block}.card-me small{font-size:13.5px;color:var(--chalk-2);font-weight:600}
.sh-label{margin:22px 4px 8px;font-size:15px;font-weight:750;color:var(--text)}
.group{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh1),inset 0 0 0 1px var(--line);overflow:hidden}
.group.pad{padding:14px 16px 16px}
.li{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:10px 16px;border-bottom:1px solid var(--line);text-align:left}
.li:last-child{border-bottom:0}
.li .ic:first-child{color:var(--brand)}
.li .tx{flex:1;min-width:0}.li .tx b{display:block;font-size:16px;font-weight:650;overflow-wrap:anywhere}.li .tx small{display:block;font-size:13px;color:var(--text-3);font-weight:550;line-height:1.35;margin-top:1px}
.li .chev{width:20px;height:20px;color:var(--line-2)}
.li.danger .ic:first-child,.li.danger b{color:var(--bad)}
.li-seg{padding:12px 16px}
.sw-li{cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:750;background:var(--surface-2);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;flex:none}
.badge.ok{background:var(--ok-soft);color:var(--ok);box-shadow:none}.badge.warn{background:var(--warn-soft);color:var(--warn);box-shadow:none}.badge.bad{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.steps{margin:6px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:14px}
.steps li{position:relative;padding-left:40px;font-size:15px;line-height:1.45;color:var(--text)}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:750;font-size:14px}
.steps b{font-weight:700}
.code{display:block;white-space:pre-wrap;word-break:break-word;margin:8px 0 0;padding:12px;border-radius:10px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text)}
.h3{font-size:16px;font-weight:750;margin:20px 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0;font-size:15px}.kv dt{color:var(--text-3);font-weight:600}.kv dd{margin:0;font-weight:700;text-align:right}
.tl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
.tl li{position:relative;padding-left:22px;font-size:14.5px;line-height:1.35}
.tl li::before{content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--brand)}
.tl li::after{content:"";position:absolute;left:9px;top:17px;bottom:-12px;width:1.5px;background:var(--line-2)}
.tl li:last-child::after{display:none}
.tl small{display:block;color:var(--text-3);font-weight:600;font-size:12.5px}
textarea.share{min-height:260px;font-size:15px;line-height:1.4;padding:12px 14px}

/* ---------- assinatura (Pix) ---------- */
.plan{border-radius:18px;padding:16px 18px 18px;margin:4px 0 16px;background:var(--board);background-image:radial-gradient(120% 160% at 100% 0%,var(--board-2) 0%,transparent 60%);color:var(--chalk);position:relative;overflow:hidden}
.plan::after{content:"";position:absolute;left:18px;width:56px;bottom:0;height:4px;border-radius:4px 4px 0 0;background:var(--glow-rec)}
.plan-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.plan-name{font-weight:750;font-size:15px;color:var(--chalk-2)}
.plan .badge{background:rgba(255,255,255,.1);color:var(--chalk);box-shadow:none}
.plan .badge.bad{background:#5A1F1A;color:#FFD3CD}.plan .badge.warn{background:#4A3410;color:#FFE1B0}.plan .badge.ok{background:#164A2E;color:#BDF5D3}
.plan-price{font-size:42px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:10px}
.plan-price small{display:block;font-size:14px;font-weight:650;letter-spacing:0;color:var(--chalk-2);margin-top:2px}
.plan-line{font-size:14px;font-weight:550;color:var(--chalk-2);margin-top:10px;line-height:1.4}
.perks{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:10px}
.perks li{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:600;line-height:1.35}
.perks .ic{width:20px;height:20px;color:var(--ok);stroke-width:2.6;margin-top:1px}
.qr-box{display:grid;place-items:center}
.qr{width:min(220px,62vw);height:auto;aspect-ratio:1;border-radius:12px;background:#fff;padding:2px;box-shadow:inset 0 0 0 1px var(--line)}
.pixcode{min-height:0;font:13.5px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;padding:12px 14px;resize:none}
.waiting{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:14.5px;font-weight:600;color:var(--text-2);line-height:1.4}
.pix+.note{margin-top:14px}
.spin{width:18px;height:18px;flex:none;border-radius:50%;border:2.5px solid var(--line-2);border-top-color:var(--brand);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 4px}
.kpi{border-radius:14px;padding:10px 8px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);text-align:center}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}.kpi span{font-size:12px;font-weight:650;color:var(--text-3)}
.adm-pay{align-items:flex-start}
.adm-pay .two{margin-top:10px;grid-template-columns:auto auto;justify-content:start}
.adm-pay.hot{background:var(--info-soft)}
.mp-on{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;font-weight:600;line-height:1.4}
.steps.small{gap:10px}.steps.small li{font-size:14px;padding-left:36px}.steps.small li::before{width:24px;height:24px;font-size:13px}

/* ---------- avisos ---------- */
#toasts{position:fixed;left:0;right:0;top:calc(var(--sat) + 68px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;width:100%;max-width:520px;background:var(--board);color:var(--chalk);border-radius:14px;padding:12px 14px;font-weight:600;font-size:15px;line-height:1.3;box-shadow:var(--sh2);animation:up .18s ease-out}
.toast .ic{width:20px;height:20px;flex:none;color:#6FE3A0}.toast.bad .ic{color:#FF9A90}.toast.info .ic{color:#9CC9FF}
:root[data-theme="dark"] .toast{background:#EDF4F0;color:#0F1A14}
:root[data-theme="dark"] .toast .ic{color:var(--brand)}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + var(--sat)) 20px calc(24px + var(--sab));max-width:460px;margin:0 auto}
.login .hero{border-radius:22px;padding:20px 20px 22px;margin:0 0 22px;background:var(--board);background-image:radial-gradient(130% 160% at 100% 0%,var(--board-2) 0%,transparent 62%);color:var(--chalk);position:relative;overflow:hidden}
.login .hero::after{content:"";position:absolute;left:20px;width:64px;bottom:0;height:4px;border-radius:4px 4px 0 0;background:var(--glow-rec)}
.login .logo{width:56px;height:56px;margin-bottom:16px;border-radius:15px;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.login h1{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.login .lead{margin:8px 0 0;color:var(--chalk-2);font-size:15.5px;font-weight:550;line-height:1.4;max-width:32ch}
.login .prof{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.pbtn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-2);font-weight:700;font-size:16px}
.pbtn .ic{width:26px;height:26px;color:var(--brand)}
.pbtn[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--brand),0 0 0 4px var(--ring);background:var(--brand-soft)}
.pw{position:relative}.pw .inp{padding-right:78px}
.pw button{position:absolute;right:6px;top:7px;height:40px;padding:0 12px;border-radius:9px;font-weight:700;font-size:14px;color:var(--brand)}
.foot{margin-top:22px;text-align:center;font-size:13px;color:var(--text-3);font-weight:550}
@media(min-width:900px){body{background:var(--bg)}.page{padding-top:12px}}

/* ---------- várias mercadorias ---------- */
.sub{display:block}
.e-body .sub+.sub{margin-top:1px}
.icard{border-radius:var(--r);background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line);padding:12px 12px 14px;margin:0 0 12px}
.icard .inp{background:var(--surface)}
.ihead{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.ihead b{font-size:15px;font-weight:750;flex:1}
.isub{font-size:13px;font-weight:650;color:var(--text-2)}.isub b{font-size:15px;color:var(--text);margin-left:4px}
.iconbtn.sm{width:36px;height:36px}
.itbl{border-radius:var(--r2);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);padding:2px 12px;margin:10px 0 12px}
.itr{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.itr:last-child{border-bottom:0}.itr b{display:block;font-size:15.5px;font-weight:700;line-height:1.25}.itr small{font-size:13px;color:var(--text-3);font-weight:600}.itr span{font-weight:800;white-space:nowrap}
/* ---------- buscar ---------- */
.bgroup{display:flex;align-items:center;gap:8px;margin:20px 2px 8px;font-size:15px;font-weight:750;color:var(--text)}
.bgroup .n{margin-left:auto;font-size:13.5px;font-weight:650;color:var(--text-3)}
.busca{background:var(--surface);border-radius:var(--r);margin:0 0 12px;box-shadow:var(--sh1),inset 0 0 0 1px var(--line);overflow:hidden}
.busca.flash{box-shadow:0 0 0 3px #F5B700,var(--sh2)}
.busca header{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.busca .rel{font-size:13px;color:var(--text-3);font-weight:600;flex:1;min-width:0}
.prog{font-size:13px;font-weight:750;padding:3px 9px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.busca.done .prog{background:var(--ok-soft);color:var(--ok);box-shadow:none}
.bobs{padding:0 14px 6px;font-size:14px;color:var(--text-2);font-weight:600}
.bits{display:grid}
.bit{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;width:100%;min-height:64px;padding:8px 14px;border-top:1px solid var(--line);text-align:left}
.bck{width:32px;height:32px;border-radius:10px;box-shadow:inset 0 0 0 2px var(--line-2);display:grid;place-items:center;background:var(--surface)}
.bck .ic{width:20px;height:20px;stroke:var(--on-brand);stroke-width:3}
.bit.on .bck{background:var(--ok);box-shadow:none}
.btx b{display:block;font-size:17px;font-weight:700;line-height:1.2}.btx small{display:block;font-size:13px;color:var(--text-3);font-weight:600}
.bit.on .btx b{text-decoration:line-through;opacity:.55}
.busca.canc{opacity:.6}
.bfoot{padding:10px 14px 14px;display:grid;gap:8px;border-top:1px solid var(--line)}
.bfoot .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* ---------- calculadora ---------- */
.calc{max-width:420px;margin:10px auto 0}
.cdisp{background:var(--board);color:var(--chalk);border-radius:var(--r);padding:14px 16px;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end;text-align:right;overflow:hidden}
.cexpr{font-size:26px;font-weight:650;color:var(--chalk-2);word-break:break-all;min-height:34px;line-height:1.2}
.cres{font-size:44px;font-weight:800;letter-spacing:-.025em;line-height:1.1;color:var(--chalk);word-break:break-all}
.cres.err{color:#FF9A90;font-size:28px}.cres.prev{color:var(--chalk-2);font-size:30px;font-weight:700}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.ck{height:68px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-size:26px;font-weight:700;display:grid;place-items:center;transition:transform .06s}
.ck:active{transform:scale(.95)}

<script>
/* ===== NÚCLEO: funções puras (datas, dinheiro, texto, regras) ===== */
const CORE = (function () {
  'use strict';

  const pad2 = n => String(n).padStart(2, '0');

  /* ---------- Datas (strings AAAA-MM-DD, aritmética em UTC: sem erro de fuso/horário) ---------- */
  function todayISO(now) {
    const d = now ? new Date(now) : new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function isoToMs(iso) { const p = iso.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function msToISO(ms) { const d = new Date(ms); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }
  function addDays(iso, n) { return msToISO(isoToMs(iso) + n * 86400000); }
  function dow(iso) { return new Date(isoToMs(iso)).getUTCDay(); }
  function mondayOf(iso) { return addDays(iso, -((dow(iso) + 6) % 7)); }
  function validISO(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && msToISO(isoToMs(s)) === s; }
  const DOW = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  function fmtDM(iso) { return iso.slice(8, 10) + '/' + iso.slice(5, 7); }
  function fmtDMY(iso) { return fmtDM(iso) + '/' + iso.slice(0, 4); }
  function monthKey(iso) { return iso.slice(0, 7); }
  function addMonths(mk, n) {
    let y = +mk.slice(0, 4), m = +mk.slice(5, 7) - 1 + n;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return y + '-' + pad2(m + 1);
  }
  function monthsBetween(a, b) {
    const out = []; let c = a;
    while (c <= b && out.length < 120) { out.push(c); c = addMonths(c, 1); }
    return out;
  }
  function daysBetween(a, b) { return Math.round((isoToMs(b) - isoToMs(a)) / 86400000); }
  function relDay(iso, today) {
    const n = daysBetween(iso, today);
    if (n === 0) return 'hoje';
    if (n === 1) return 'ontem';
    if (n > 1) return 'há ' + n + ' dias';
    if (n === -1) return 'amanhã';
    return 'em ' + (-n) + ' dias';
  }
  function fmtHM(ms) { const d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  function fmtStamp(ms) { const d = new Date(ms); return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + ' ' + fmtHM(ms); }

  /* ---------- Dinheiro / números ---------- */
  const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  function money(cents) { return BRL.format((Number(cents) || 0) / 100); }
  function parseNum(str) {
    if (str == null) return NaN;
    let s = String(str).trim().replace(/\s|R\$/gi, '');
    if (!s || !/^[\d.,]+$/.test(s)) return NaN;
    const hasC = s.includes(','), hasD = s.includes('.');
    if (hasC && hasD) {
      if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else if (hasC) {
      const p = s.split(',');
      s = p.length > 2 ? p.join('') : p[0] + '.' + p[1];
    } else if (hasD) {
      const p = s.split('.');
      if (p.length > 2) s = p.join('');
      else if (/^[1-9]\d{0,2}$/.test(p[0]) && /^\d{3}$/.test(p[1])) s = p[0] + p[1]; // 1.500 -> 1500 (milhar)
    }
    const n = Number(s);
    return Number.isFinite(n) ? n : NaN;
  }
  function toCents(n) { return Math.round(n * 100); }
  function calcTotal(qtd, precoCents) { return Math.round(qtd * precoCents); }
  function fmtQtd(q) {
    q = Number(q) || 0;
    return Number.isInteger(q) ? String(q) : q.toLocaleString('pt-BR', { maximumFractionDigits: 3 });
  }
  function fmtInputNum(n) { return String(n).replace('.', ','); }

  /* ---------- Texto ---------- */
  const strip = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  function norm(s) { return strip(s).toLowerCase().replace(/\s+/g, ' ').trim(); }
  function normPass(s) { return strip(s).trim(); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function cap(s) { s = String(s || '').trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  /* ---------- SHA-256 (JS puro, síncrono) ---------- */
  const K256 = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);
  function sha256(msg) {
    const bytes = new TextEncoder().encode(msg);
    const l = bytes.length, padLen = ((l + 9 + 63) >> 6) << 6;
    const buf = new Uint8Array(padLen); buf.set(bytes); buf[l] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(padLen - 8, Math.floor(l * 8 / 0x100000000));
    dv.setUint32(padLen - 4, (l * 8) >>> 0);
    const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    const w = new Uint32Array(64);
    const rotr = (x, n) => (x >>> n) | (x << (32 - n));
    for (let o = 0; o < padLen; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
      }
      let [a, b, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K256[i] + w[i]) >>> 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        const mj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + mj) >>> 0;

/* ===== ARMAZENAMENTO =====
   Padrão: neste aparelho (localStorage), funciona na hora.
   Online: servidor Ceasa (contas + sincronização em tempo real entre aparelhos). */

function makeLocalDB(ns) {
  const PFX = 'ceasa:d:' + ns + ':';
  const data = new Map(), subs = new Set();
  const coll = c => { let m = data.get(c); if (!m) { m = new Map(); data.set(c, m); } return m; };
  const clone = o => JSON.parse(JSON.stringify(o));
  const meta = { fromCache: false, hasPendingWrites: false };
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith(PFX)) continue;
      const p = k.slice(PFX.length), j = p.indexOf('/'); if (j < 1) continue;
      try { coll(p.slice(0, j)).set(p.slice(j + 1), JSON.parse(localStorage.getItem(k))); } catch (e) {}
    }
  } catch (e) {}
  const emit = c => subs.forEach(s => { if (s.coll === c) Promise.resolve().then(s.run); });
  const persist = (c, id, o) => {
    try { localStorage.setItem(PFX + c + '/' + id, JSON.stringify(o)); }
    catch (e) { const er = new Error('Armazenamento do aparelho cheio'); er.code = 'quota_exceeded'; throw er; }
  };
  window.addEventListener('storage', ev => {                 // outra aba do mesmo aparelho mexeu nos dados
    if (!ev.key || !ev.key.startsWith(PFX)) return;
    const p = ev.key.slice(PFX.length), j = p.indexOf('/'); if (j < 1) return;
    const c = p.slice(0, j), id = p.slice(j + 1);
    if (ev.newValue) { try { coll(c).set(id, JSON.parse(ev.newValue)); } catch (e) {} } else coll(c).delete(id);
    emit(c);
  });
  const match = (d, f) => {
    const x = d[f[0]], v = f[2];
    switch (f[1]) {
      case '==': return x === v; case '!=': return x !== v;
      case '>=': return x !== undefined && x >= v; case '<=': return x !== undefined && x <= v;
      case '>': return x !== undefined && x > v; case '<': return x !== undefined && x < v;
    }
    return false;
  };
  const snapDoc = (id, d) => ({ id, exists: true, data: () => clone(d), metadata: meta });
  const mkSnap = (docs, ch) => ({ docs, size: docs.length, empty: !docs.length, docChanges: () => ch, metadata: meta });

  class Q {
    constructor(c, f) { this.coll = c; this.f = f || []; }
    where(a, b, c) { return new Q(this.coll, this.f.concat([[a, b, c]])); }
    _rows() { return Array.from(coll(this.coll).entries()).filter(r => this.f.every(f => match(r[1], f))).sort((a, b) => a[0] < b[0] ? -1 : 1); }
    async get() { return mkSnap(this._rows().map(r => snapDoc(r[0], r[1])), []); }
    onSnapshot(next) {
      let prev = new Map(), first = true, alive = true; const self = this;
      const run = () => {
        if (!alive) return;
        const rows = self._rows(), cur = new Map(rows.map(r => [r[0], JSON.stringify(r[1])])), ch = [];
        cur.forEach((s, id) => {
          if (!prev.has(id)) ch.push({ type: 'added', doc: snapDoc(id, JSON.parse(s)) });
          else if (prev.get(id) !== s) ch.push({ type: 'modified', doc: snapDoc(id, JSON.parse(s)) });
        });
        prev.forEach((s, id) => { if (!cur.has(id)) ch.push({ type: 'removed', doc: snapDoc(id, JSON.parse(s)) }); });
        prev = cur;
        if (first || ch.length) { first = false; next(mkSnap(rows.map(r => snapDoc(r[0], r[1])), ch)); }
      };
      const sub = { coll: this.coll, run }; subs.add(sub); Promise.resolve().then(run);
      return () => { alive = false; subs.delete(sub); };
    }
    doc(id) {
      const c = this.coll;
      return {
        id,
        async get() { const d = coll(c).get(id); return d ? snapDoc(id, d) : { id, exists: false, data: () => undefined, metadata: meta }; },
        async set(o) { const v = clone(o); persist(c, id, v); coll(c).set(id, v); emit(c); },
        async delete() { try { localStorage.removeItem(PFX + c + '/' + id); } catch (e) {} coll(c).delete(id); emit(c); },
        async update(o) {
          const cur = coll(c).get(id);
          if (!cur) { const er = new Error('Documento inexistente'); er.code = 'not_found'; throw er; }
          const v = CORE.deepMerge(cur, clone(o)); persist(c, id, v); coll(c).set(id, v); emit(c);
        }
      };
    }
  }
  return {
    kind: 'local',
    collection: c => new Q(c),
    dumpAll() { const out = []; data.forEach((m, c) => m.forEach((d, id) => out.push({ coll: c, id, data: clone(d) }))); return out; },
    count() { let n = 0; data.forEach(m => { n += m.size; }); return n; }
  };
}

/* ---- servidor próprio: contas e sincronização em tempo real entre aparelhos ---- */

  const upsert = (c, id, data, seq) => { const m = bucket(c), cur = m.get(id); if (!cur || seq >= cur.seq) m.set(id, { data, seq }); };

  const mkSnap = (docs, ch) => ({ docs, size: docs.length, empty: !docs.length, docChanges: () => ch, metadata: meta() });
  const rows = sub => { const out = []; bucket(sub.coll).forEach((x, id) => { if (sub.f.every(f => match(x.data, f))) out.push([id, x.data]); }); return out.sort((a, b) => a[0] < b[0] ? -1 : 1); };

    sub.prev.forEach((s, id) => { if (!cur.has(id)) ch.push({ type: 'removed', doc: snapDoc(id, JSON.parse(s)) }); });

  const emitColl = c => subs.forEach(s => { if (s.hydrated && (!c || s.coll === c)) emit(s); });

        async get() { const j = await http('POST', '/api/docs/get', { coll, id }); return j.exists ? snapDoc(id, j.doc.data) : { id, exists: false, data: () => undefined, metadata: meta() }; },
        set: data => write([{ op: 'set', coll, id, data }]).then(() => {}),

    nudge() { try { if (ctl) ctl.abort(); } catch (e) {} },
    close() { alive = false; subs.clear(); try { if (ctl) ctl.abort(); } catch (e) {} }
  };
}

function homeListHTML(all) {

  if (nq) L = L.filter(e => norm(e.nome + ' ' + e.marca + ' ' + e.merc).includes(nq));
  if (!L.length) {

  const stat = (t, title, icn) => { const s = sm(t); return '<div class="stat ' + tipoCls(t) + '"><h3>' + ico(icn, 'sm') + title + '</h3><dl><div><dt>Lançado</dt><dd>' + money(s.l) + '</dd></div><div><dt>Pago</dt><dd>' + money(s.p) + '</dd></div><div><dt>Em aberto</dt><dd>' + money(s.o) + '</dd></div></dl></div>'; };
  $('#hSum').innerHTML = '<div class="stats">' + stat('receber', 'A receber', 'arrow-in') + stat('pagar', 'A pagar', 'arrow-out') + '</div>';
  const L = histEntries();

    L.forEach(e => { const k = e.tipo + '|' + e.pk; if (!groups.has(k)) groups.set(k, { tipo: e.tipo, nome: e.nome, items: [] }); groups.get(k).items.push(e); });
    html = Array.from(groups.values()).sort((a, b) => a.tipo < b.tipo ? 1 : a.tipo > b.tipo ? -1 : a.nome.localeCompare(b.nome, 'pt-BR')).map(g => {

        g.items.map(e => stItem(e, false)).join('') + '</section>';
    }).join('');
  }
  $('#hList').innerHTML = html;
  $('#hFoot').innerHTML = L.length ? '<button class="btn block" data-act="hist-csv">' + ico('download') + 'Baixar planilha da semana (CSV)</button>' : '';
}

function payPoll() {
  clearTimeout(S.payT);
  const P = S.payFlow; if (!P || !S.db || !S.sheet || S.sheet.kind !== 'pay') return;
  S.payT = setTimeout(async () => {
    if (S.payFlow !== P || !S.sheet || S.sheet.kind !== 'pay') return;
    try {
      const j = await S.db.req('GET', '/api/pay/status?id=' + encodeURIComponent(P.id));
      if (j.status === 'approved') {
        S.payFlow = null; closeSheet();
        const before = canWrite(); setPlan(j.plan);
        if (before) toast('Pagamento confirmado. Obrigado!', 'ok', 4500);
        return;
      }
      if (j.status === 'approved') {}
      else if (P.provider === 'mpc') { if (j.status !== P.status) { P.status = j.status; redrawPay(); } }
      else if (j.status === 'rejected') { S.payFlow = null; redrawPay(); toast('Esse pagamento não foi encontrado. Gere um novo Pix ou fale com o responsável.', 'bad', 6000); return; }
      else if (j.status !== P.status && (j.status === 'avisado' || j.status === 'pending')) { P.status = j.status; redrawPay(); }
    } catch (e) {}
    payPoll();
  }, P.provider === 'manual' ? 8000 : 4000);
}

async function backup() {
  if (!S.db) { toast('Aguarde a conexão e tente de novo.', 'bad'); return false; }
  toast('Preparando a cópia…', 'info', 2000);
  try {
    const today = todayISO(), docs = [];
    if (S.db.dumpAll) S.db.dumpAll().forEach(d => docs.push(d));
    else {
      const months = monthsBetween(addMonths(monthKey(today), -60), monthKey(addDays(today, MAX_AHEAD_DAYS)));
      await Promise.all(months.flatMap(m => ['lanc-', 'busca-'].map(p => S.db.collection(p + m).get().then(snap => snap.docs.forEach(d => docs.push({ coll: p + m, id: d.id, data: d.data() }))))));
    }
    downloadFile('controle-ceasa-copia-' + todayISO() + '.json', JSON.stringify({ app: 'controle-ceasa', v: 1, exportedAt: Date.now(), conta: S.acct ? S.acct.email : '', docs }), 'application/json');
    store.set('ceasa_bkp', String(Date.now())); scheduleRender();
    toast(docs.length + ' registros na cópia de segurança', 'ok'); return true;
  } catch (e) { toast('Não foi possível gerar a cópia agora.', 'bad'); return false; }
}
const docOk = d => d && /^(lanc|busca)-\d{4}-\d{2}$/.test(d.coll) && /^[A-Za-z0-9_-]{1,80}$/.test(d.id) && (d.coll.startsWith('busca-') ? cleanBusca(d.id, d.data) : cleanEntry(d.id, d.data));
async function restoreFile(file) {
  if (!file || !S.db) return;
  try {
    const o = JSON.parse(await file.text());
    if (!o || o.app !== 'controle-ceasa' || !Array.isArray(o.docs)) throw new Error('arquivo inválido');
    const ok = o.docs.filter(docOk); let n = 0;
    for (let i = 0; i < ok.length; i += 8) {
      await Promise.all(ok.slice(i, i + 8).map(async d => {
        const ref = S.db.collection(d.coll).doc(d.id), s = await ref.get();
        if (!s.exists || (Number(s.data().v) || 0) < (Number(d.data.v) || 0)) { await ref.set(d.data); n++; }
      }));
    }
    toast(n + ' registros restaurados (nada foi apagado)', 'ok', 4200); scheduleRender();
  } catch (e) { toast('Arquivo de cópia inválido.', 'bad'); }
}
// Traz para a conta atual dados que já estavam neste aparelho (antes das contas, ou de uma conta local com o mesmo e-mail). Nunca apaga o original.
async function importDocs(docs) {
  let n = 0;
  for (let i = 0; i < docs.length; i += 8) {
    await Promise.all(docs.slice(i, i + 8).map(async d => {
      if (!docOk(d)) return;
      const ref = S.db.collection(d.coll).doc(d.id), s = await ref.get();
      if (!s.exists) { await ref.set(d.data); n++; }
    }));
  }
  return n;
}

async function logout() {
  const n = S.outbox.length;
  const ok = await confirmBox({ title: 'Sair da conta?', html: '<p class="cnote" style="margin:0">' + (n ? 'Há ' + n + ' alteração(ões) ainda não enviada(s). Elas continuam guardadas neste aparelho e são enviadas quando você entrar de novo com este e-mail.' : 'Seus lançamentos continuam guardados. É só entrar de novo com o mesmo e-mail e senha.') + '</p>', ok: 'Sair', cls: 'primary', cancel: 'Continuar logado' });
  if (!ok) return;
  if (S.mode === 'cloud') { try { const t = (readSess() || {}).tok; if (t) await Promise.race([fetch(S.cfg + '/api/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + t } }), delay(3000)]); } catch (e) {} }
  store.del('ceasa_sess'); location.reload();
}
function switchProfile(v) { if (!USERS[v]) return; S.me = USERS[v]; store.set('ceasa_perfil', v); render(); toast('Agora você está como ' + S.me.label, 'ok'); }
function askProfile() {
  openSheet(sheetHTML('Quem está usando agora?', '<p class="sub" style="margin:0 0 14px">Escolha o perfil. Loja e Caminhão mostram os mesmos lançamentos desta conta.</p><div class="prof" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0">' +
    '<button class="pbtn" data-act="profile-pick" data-v="loja">' + ico('store') + 'Loja</button><button class="pbtn" data-act="profile-pick" data-v="caminhao">' + ico('truck') + 'Caminhão</button></div>', '', true), 'form');
}
function showRecovery(code) {
  openSheet(sheetHTML('Guarde o código de recuperação', '<p class="sub" style="margin:0 0 12px">Se um dia você esquecer a senha, este código troca a senha <b>sem perder nenhum lançamento</b>. Ele só aparece agora: anote ou copie.</p><code class="code" id="recTxt" style="font-size:24px;text-align:center;letter-spacing:.08em;padding:18px">' + esc(code) + '</code>',
    '<button class="btn primary block" data-act="copy-code">' + ico('copy') + 'Copiar código</button><button class="btn block" data-act="close">Já guardei</button>', true), 'form');
}
function openLocalReset(email) {
  openSheet(sheetHTML('Trocar a senha', '<p class="sub" style="margin:0 0 12px">Digite o e-mail, o código de recuperação e a nova senha. Os lançamentos continuam guardados.</p>' +
    '<div class="field"><label for="rEmail">E-mail</label><input id="rEmail" class="inp" type="email" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(email || '') + '"></div>' +
    '<div class="field"><label for="rCode">Código de recuperação</label><input id="rCode" class="inp" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX"></div>' +
    '<div class="field"><label for="rPass">Nova senha</label><input id="rPass" class="inp" type="password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"></div>' +
    '<div class="err-msg" id="rErr" role="alert"></div><p class="cnote" style="margin:0">Sem o código não dá para recuperar a conta neste modo, mas o arquivo de cópia de segurança sempre restaura os lançamentos em uma conta nova.</p>',
    '<button class="btn primary block" data-act="local-reset-go">Trocar a senha</button>'), 'cfg');
}
async function doLocalReset() {
  const email = $('#rEmail').value, code = $('#rCode').value, pass = $('#rPass').value, err = $('#rErr');
  if (!validEmail(email)) { err.textContent = 'Digite um e-mail válido.'; return; }
  if (pass.length < 6) { err.textContent = 'A nova senha precisa ter pelo menos 6 caracteres.'; return; }
  if (S.mode === 'cloud') {
    try { const res = await authCall('/api/auth/reset', { email: emailKey(email), code, password: pass }); closeSheet(); serverEnter(res); setTimeout(() => showRecovery(res.recovery), 300); toast('Senha trocada. Guarde o novo código.', 'ok', 4200); }
    catch (e) { err.textContent = authMsg(e); }
    return;
  }
  try { localReset(email, code, pass); } catch (e) { err.textContent = authMsg(e); return; }
  closeSheet(); $('#lEmail').value = emailKey(email); $('#lPass').value = ''; setLoginTab('in');
  toast('Senha trocada. Entre com a nova senha.', 'ok', 4200);
}
function newRecovery() {
  if (S.mode !== 'cloud') { const c = localNewRecovery(); if (c) showRecovery(c); return; }
  openSheet(sheetHTML('Novo código de recuperação', '<p class="sub" style="margin:0 0 12px">Digite a sua senha para gerar um novo código. O código antigo deixa de valer.</p><div class="field"><label for="nrPass">Senha</label><input id="nrPass" class="inp" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"></div><div class="err-msg" id="nrErr" role="alert"></div>', '<button class="btn primary block" data-act="new-recovery-go">Gerar código</button>'), 'cfg');
}
async function newRecoveryGo() {
  try { const j = await S.db.req('POST', '/api/auth/recovery', { password: $('#nrPass').value }); closeSheet(); showRecovery(j.recovery); }
  catch (e) { $('#nrErr').textContent = (e.code === 'denied' || e.code === 'invalid_argument') ? 'Senha incorreta.' : authMsg(e); }
}

/* ---------- ações de toque (delegadas) ---------- */
const ACT = {
  go: el => go(el.dataset.v),
  tab: el => { S.tab = el.dataset.v; S.ui.home.limit = 120; render(); },
  filter: el => { S.ui.home.f = el.dataset.v; S.ui.home.limit = 120; render(); },
  more: () => { S.ui.home.limit = (S.ui.home.limit || 120) + 120; render(); },
  new: () => (S.view === 'busca' ? openBuscaForm(null) : openForm(null)),
  close: () => closeSheet(), back: () => closeSheet(),
  open: el => openDetail(el.dataset.id),
  desp: el => toggleDesp(el.dataset.id), pay: el => payOne(el.dataset.id), unpay: el => unpayOne(el.dataset.id),
  'cancel-entry': el => cancelEntry(el.dataset.id), reopen: el => reopenEntry(el.dataset.id), edit: el => openForm(el.dataset.id),
  'f-tipo': el => formSetTipo(el.dataset.v), 'f-orig': el => formSetSeg('origem', el.dataset.v, el), 'f-desp': el => formSetSeg('desp', el.dataset.v === '1', el),
  'f-chip': el => formChip(el), 'f-save': () => saveForm(false), 'f-save-new': () => saveForm(true), 'f-close': () => closeForm(),
  logout: () => logout(), 'sync-info': () => syncInfoToast(),
  profile: el => switchProfile(el.dataset.v),
  'profile-pick': el => { if (!USERS[el.dataset.v]) return; S.me = USERS[el.dataset.v]; store.set('ceasa_perfil', S.me.key); closeSheet(); showApp(); },
  'new-recovery': () => newRecovery(), 'new-recovery-go': () => newRecoveryGo(),
  'local-reset-go': () => doLocalReset(),
  'copy-code': () => { const c = $('#recTxt'); if (c) copyText(c.textContent.trim(), 'Código copiado'); },
  theme: el => { store.set('ceasa_tema', el.dataset.v); applyTheme(); Array.from(el.parentElement.children).forEach(b => b.setAttribute('aria-pressed', String(b === el))); },
  'f-ftipo': el => { const f = S.ui.fech; f.tipo = el.dataset.v; f.pk = ''; f.q = ''; f.unsel = new Set(); render(); },
  pick: el => { const f = S.ui.fech; f.pk = el.dataset.pk; f.unsel = new Set(); render(); window.scrollTo(0, 0); loadWeek(f.week); },
  'f-back': () => { S.ui.fech.pk = ''; render(); window.scrollTo(0, 0); },
  'wk-prev': el => weekNav(el.dataset.w, 'prev'), 'wk-next': el => weekNav(el.dataset.w, 'next'), 'wk-now': el => weekNav(el.dataset.w, 'now'),
  'st-pay': () => stPay(), 'st-share': () => stShare(),
  copy: () => { const ta = $('#shText'); if (ta) copyText(ta.value, 'Texto copiado'); },
  'native-share': () => { const ta = $('#shText'); if (ta) navigator.share({ text: ta.value }).catch(() => {}); },
  'h-tipo': el => { S.ui.hist.tipo = el.dataset.v; render(); }, 'h-st': el => { S.ui.hist.st = el.dataset.v; render(); },
  'hist-csv': () => histCSV(),
  diag: () => { closeSheet(); runDiag(); },
  'guide-accounts': () => openSheet(guideAccountsHTML(), 'guide'), 'guide-host': () => openSheet(guideHostHTML(), 'guide'),
  'b-filter': el => { S.ui.busca.f = el.dataset.v; render(); }, 'b-loc': el => { S.ui.busca.loc = el.dataset.v; render(); },
  'b-tick': el => buscaTick(el.dataset.id, Number(el.dataset.i)), 'b-all': el => buscaAll(el.dataset.id), 'b-edit': el => openBuscaForm(el.dataset.id),
  'b-cancel': el => buscaCancel(el.dataset.id), 'b-reopen': el => buscaReopen(el.dataset.id),
  'f-additem': () => formAddItem(), 'f-delitem': el => formDelItem(Number(el.dataset.i)), 'f-local': el => formSetSeg('local', el.dataset.v, el),
  'calc-key': el => calcKey(el.dataset.k), 'calc-hist': el => calcHist(Number(el.dataset.i)),
  purge: () => openPurge(), 'purge-days': el => { if (S.purge) { S.purge.days = Number(el.dataset.v); purgeScan(); } }, 'purge-backup': () => purgeBackup(), 'purge-run': () => purgeRun(),
  backup: () => backup(), restore: () => { const i = $('#restoreFile'); if (i) { i.value = ''; i.click(); } },
  'pay-open': () => openPay(), 'pay-start': () => payStart(), 'pay-claim': () => payClaim(), 'pay-card': () => payCard(),
  'pay-card-again': () => { if (S.payFlow && S.payFlow.url) location.href = S.payFlow.url; },
  'pay-pix-instead': () => { S.payFlow = null; redrawPay(); payStart(); },
  'adm-mp': () => admMp(false), 'adm-mp-off': () => admMp(true),
  'pay-copy': () => { const t = $('#pixCode'); if (t) copyText(t.value, 'Código Pix copiado. Cole no app do banco, em Pix copia e cola.'); },
  admin: () => openAdmin(), 'adm-pix': () => admPix(), 'adm-life': () => admGrant('lifetime'), 'adm-days': () => admGrant('days'),
  'adm-unlife': el => admGrant('unlifetime', el.dataset.email), 'adm-confirm': el => admConfirm(el.dataset.id), 'adm-reject': el => admConfirm(el.dataset.id, true)
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'back' && ev.target !== el) return;
  if (WRITE_ACTS.has(act) && !canWrite()) { openPay(); return; }            // período encerrado: só leitura (nada some), oferece renovar
  const fn = ACT[act]; if (fn) fn(el, ev);
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { S.ui.home.q = t.value; S.ui.home.limit = 120; const l = $('#list'); if (l) l.innerHTML = homeListHTML(Array.from(S.all.values())); }
  else if (t.id === 'hq') { S.ui.hist.q = t.value; updateHist(); }
  else if (t.id === 'fq') { S.ui.fech.q = t.value; updateFech(); }
  else if (t.id === 'fQuick') formQuick();
  else if (/^f(Qtd|Preco)\d+$/.test(t.id)) { t.classList.remove('err'); formCalc(); }
  else if (t.id === 'pgTxt') purgeRefresh();
  else if (S.form && t.classList && t.classList.contains('inp')) t.classList.remove('err');
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'onlyDesp') { S.ui.fech.onlyDesp = t.checked; render(); }
  else if (t.dataset && 'sel' in t.dataset) { const f = S.ui.fech; if (t.checked) f.unsel.delete(t.dataset.sel); else f.unsel.add(t.dataset.sel); updateSelBar(); }
  else if (t.id === 'hDate') { if (validISO(t.value)) { S.ui.hist.week = mondayOf(t.value); render(); loadWeek(S.ui.hist.week); } }
  else if (/^fUn\d+$/.test(t.id)) formCalc();
  else if (t.id === 'restoreFile') restoreFile(t.files && t.files[0]);
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') { calcKeyboard(ev); return; }
  const cf = $('#confirmRoot [data-cf="0"]');
  if (cf) cf.click(); else if (S.sheet) { if (S.sheet.kind === 'form') closeForm(); else closeSheet(); }
});

/* ---------- entrar / criar conta ---------- */
function setLoginTab(tab) {
  S.loginTab = tab;
  $$('#loginTabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === tab)));
  $('#lConfWrap').hidden = tab !== 'up';
  $('#lGo').textContent = tab === 'up' ? 'Criar conta' : 'Entrar';
  $('#lForgot').hidden = tab === 'up';
  $('#lPass').setAttribute('autocomplete', tab === 'up' ? 'new-password' : 'current-password');
  $('#lErr').textContent = '';
}
function showLogin() {
  $('#app').hidden = true; $('#login').hidden = false;
  $('#lErr').textContent = ''; $('#lPass').value = ''; $('#lPass2').value = '';
  const pf = USERS[store.get('ceasa_perfil')] ? store.get('ceasa_perfil') : 'loja'; $$('#loginProf .pbtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.profile === pf)));
  if (!$('#lEmail').value) $('#lEmail').value = store.get('ceasa_email') || '';
  setLoginTab(S.loginTab || 'in');
  $('#lNote').innerHTML = S.mode === 'cloud' ? '<p class="foot" style="margin:-8px 0 16px;text-align:left">O mesmo e-mail e senha valem na Loja e no Caminhão, em qualquer aparelho, e mostram os mesmos lançamentos. Cada e-mail tem seus próprios registros.</p>'
    : '<div class="note" style="margin:0 0 18px">' + ico('alert') + '<div><b>Modo local:</b> as contas e os lançamentos ficam só neste aparelho. Uma conta criada aqui <b>não entra em outro aparelho</b>. Para valer em vários aparelhos, o site precisa estar ligado ao servidor.<br><button type="button" class="btn sm" data-act="guide-accounts">Ver passo a passo</button></div></div>';
}
function showApp() { $('#login').hidden = true; $('#app').hidden = false; go('home'); }
function enterApp() {
  if (!S.me) S.me = USERS[store.get('ceasa_perfil')] || null;
  $('#login').hidden = true; $('#app').hidden = false;
  if (S.me) showApp(); else askProfile();
  clearTimeout(S.impRt); S.impRt = setTimeout(offerImports, 1500);
}
function selectedProfile() { const b = $('#loginProf .pbtn[aria-pressed="true"]'); return b ? b.dataset.profile : ''; }
function setBusy(b) { S.busy = b; const g = $('#lGo'); g.disabled = b; g.textContent = b ? 'Aguarde…' : (S.loginTab === 'up' ? 'Criar conta' : 'Entrar'); }
$('#loginProf').addEventListener('click', ev => { const b = ev.target.closest('[data-profile]'); if (!b) return; $$('#loginProf .pbtn').forEach(x => x.setAttribute('aria-pressed', String(x === b))); $('#lErr').textContent = ''; });
$('#loginTabs').addEventListener('click', ev => { const b = ev.target.closest('[data-tab]'); if (b) setLoginTab(b.dataset.tab); });
$('#lShow').addEventListener('click', () => { const p = $('#lPass'), show = p.type === 'password'; p.type = show ? 'text' : 'password'; $('#lShow').textContent = show ? 'Ocultar' : 'Mostrar'; });
$('#loginForm').addEventListener('submit', async ev => {
  ev.preventDefault(); if (S.busy) return;
  const email = emailKey($('#lEmail').value), pass = $('#lPass').value, up = S.loginTab === 'up', prof = selectedProfile(), err = m => { $('#lErr').textContent = m; };
  if (!prof) return err('Escolha se você vai entrar como Loja ou Caminhão.');
  if (!validEmail(email)) return err('Digite um e-mail válido.');
  if (pass.length < 6) return err(up ? 'A senha precisa ter pelo menos 6 caracteres.' : 'Digite a sua senha.');
  if (up && pass !== $('#lPass2').value) return err('As duas senhas não são iguais.');
  err(''); setBusy(true);
  try {
    store.set('ceasa_perfil', prof); S.me = USERS[prof]; store.set('ceasa_email', email);
    if (S.mode === 'cloud') {
      const res = await authCall(up ? '/api/auth/signup' : '/api/auth/login', { email, password: pass });
      serverEnter(res); if (up && res.recovery) setTimeout(() => showRecovery(res.recovery), 300);
    } else if (up) { const r = localSignUp(email, pass); localEnter(r.acct); setTimeout(() => showRecovery(r.rec), 300); }
    else localEnter(localSignIn(email, pass));
  } catch (e) { err(authMsg(e)); }
  finally { setBusy(false); }
});
$('#lForgot').addEventListener('click', () => openLocalReset(emailKey($('#lEmail').value)));

/* ---------- eventos do sistema e início ---------- */
window.addEventListener('online', () => { toast('Internet de volta', 'ok'); flush(); scheduleRender(); });
window.addEventListener('offline', () => { toast('Sem internet. O que você lançar fica guardado e é enviado depois.', 'bad'); scheduleRender(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkRollover(); flush(); scheduleRender(); if (S.admin) adminPoll(); } });
setInterval(() => { checkRollover(); scheduleRender(); }, 60000);

async function boot() {
  applyTheme();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}     // pede ao navegador para não apagar os dados
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  await bootAccounts();
}
window.__CEASA = { S };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();

</script>
